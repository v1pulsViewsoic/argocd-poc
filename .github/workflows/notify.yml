name: Notify

on:
  workflow_call:
    inputs:
      status:
        required: true
        type: string
      workflow:
        required: true
        type: string
      branch:
        required: true
        type: string
      actor:
        required: true
        type: string
      run_id:
        required: true
        type: string

jobs:
  notify-teams:
    runs-on: ubuntu-latest
    steps:
      - name: Send notification to Microsoft Teams
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          STATUS: ${{ inputs.status }}
          WORKFLOW: ${{ inputs.workflow }}
          BRANCH: ${{ inputs.branch }}
          TRIGGER: ${{ inputs.actor }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          echo "🔧 Debugging Variables:"
          echo "STATUS: $STATUS"
          echo "WORKFLOW: $WORKFLOW"
          echo "BRANCH: $BRANCH"
          echo "TRIGGER: $TRIGGER"
          echo "RUN_ID: $RUN_ID"
          echo "TEAMS_WEBHOOK_URL: $TEAMS_WEBHOOK_URL"

          if [ "$STATUS" = "success" ]; then
            ICON="✅ SUCCESS"
          elif [ "$STATUS" = "failure" ]; then
            ICON="❌ FAILURE"
          else
            ICON="⚠️ $STATUS"
          fi

          PAYLOAD=$(cat <<EOF
          {
            "@type": "MessageCard",
            "@context": "http://schema.org/extensions",
            "summary": "GitHub Actions Notification",
            "themeColor": "0076D7",
            "title": "GitHub Actions Pipeline Status",
            "text": "**Workflow**: \`$WORKFLOW\`\n**Repository**: \`${{ github.repository }}\`\n**Branch**: \`$BRANCH\`\n**Triggered by**: \`$TRIGGER\`\n\n**Status**: $ICON\n\n[View Workflow Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/$RUN_ID)"
          }
          EOF
          )

          echo "📦 Payload:"
          echo "$PAYLOAD"

          echo "🚀 Sending payload to Teams..."
          curl -H "Content-Type: application/json" -d "${PAYLOAD}" "$TEAMS_WEBHOOK_URL"
