# .github/workflows/test-teams-notification.yml
name: Manual Test Notification

on:
  workflow_dispatch:

jobs:
  test-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send test to Teams
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          PAYLOAD='{
            "@type": "MessageCard",
            "@context": "http://schema.org/extensions",
            "summary": "Manual Test",
            "themeColor": "0076D7",
            "title": "GitHub Actions Test",
            "text": "**Test Message** from manual dispatch."
          }'

          echo "Sending payload..."
          curl -H "Content-Type: application/json" -d "$PAYLOAD" "$TEAMS_WEBHOOK_URL"
